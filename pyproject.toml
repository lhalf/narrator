[project]
name = "narrator"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fbchat-muqit>=1.2.2",
    "openai>=1.0",
    "requests>=2.31",
    "matplotlib>=3.8",
    "levenshtein>=0.25",
    "osrsbox>=2.2.3",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
